# SPDX-License-Identifier: Apache-2.0
#
# AgentOS Tidemark - Phase 0 kernel spike on x86_64 (KVM).
# STATUS: Phase 0 draft, not yet run. It boots a stock Fedora 45 Cloud x86_64
# image under QEMU/KVM on a free GitHub runner, installs the build dependencies
# through cloud-init, builds the BPF object and the Go probe, runs every scenario
# script, and gates on the "SUMMARY: ALL PASS" line printed to the serial
# console. The serial log is always uploaded.
#
# Actions are pinned by commit SHA (resolved 2026-10-16):
#   actions/checkout        v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/upload-artifact v7.0.2  cf430e030ddbb5b0abf93d22962f4752f3646cd9
#
# As of 2026-10-16 Fedora 45 is at Beta (45_Beta 1.3); update the IMAGE_URL and
# IMAGE_SHA256 to the GA Generic Cloud qcow2 when Fedora 45 is released.
# KERNEL UNDER TEST: this job deliberately tests the kernel shipped in the
# pinned Beta compose (7.2.0-61.fc45), not the newest 7.2.x update, so that
# results are reproducible. The Makefile pins Go caches inside the spike tree,
# and the runcmd exports HOME because cloud-init's final stage runs without it.
# Re-pin task: switch to the GA image within one week of the Fedora 45 release.

name: kernel-spike

on:
  workflow_dispatch: {}
  push:
    paths:
      - "spike/**"
      - ".github/workflows/kernel-spike.yml"
  pull_request:
    paths:
      - "spike/**"
      - ".github/workflows/kernel-spike.yml"

permissions:
  contents: read

concurrency:
  group: kernel-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE_URL: "https://dl.fedoraproject.org/pub/fedora/linux/releases/test/45_Beta/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-45_Beta-1.3.x86_64.qcow2"
      IMAGE_SHA256: "06bd4382a3bc5e5f94cd520f9ee15bdfb38d7bb72552b27fe06d581ba9a84292"
      QEMU_TIMEOUT: "1800"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm || { echo "no /dev/kvm on this runner"; exit 1; }

      - name: Install QEMU and image tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils xorriso

      - name: Download and verify the Fedora 45 Cloud image
        run: |
          set -euo pipefail
          curl -fsSL "${IMAGE_URL}" -o fedora.qcow2
          echo "${IMAGE_SHA256}  fedora.qcow2" | sha256sum -c -
          # Build a sized overlay so the base image is never modified and there
          # is room for the toolchain and build output.
          qemu-img create -f qcow2 -F qcow2 -b "${PWD}/fedora.qcow2" overlay.qcow2 20G

      - name: Build the spike source ISO
        run: |
          set -euo pipefail
          # The spike tree is delivered to the VM on a labelled ISO (second
          # disk), mounted and copied to /opt/spike by cloud-init.
          xorriso -as mkisofs -V TMSPIKE -J -r -o src.iso spike

      - name: Build the cloud-init seed
        run: |
          set -euo pipefail
          cat > meta-data <<'EOF'
          instance-id: tidemark-spike
          local-hostname: tidemark-spike
          EOF
          cat > user-data <<'EOF'
          #cloud-config
          runcmd:
            - [ bash, -c, "exec > /dev/ttyS0 2>&1; set -x; mkdir -p /opt/spike; mount -o ro /dev/disk/by-label/TMSPIKE /mnt; cp -a /mnt/. /opt/spike/; umount /mnt; export HOME=/root; bash /opt/spike/provision/fedora-deps.sh; make -C /opt/spike test SUDO=; echo TIDEMARK-SPIKE-RC=$?; sync; poweroff -f" ]
          EOF
          cloud-localds seed.iso user-data meta-data

      - name: Boot the VM and run the spike
        run: |
          set -euo pipefail
          : > serial.log
          # BIOS boot (SeaBIOS) of the Generic cloud image; user-mode networking
          # so dnf can reach the mirrors. Bounded by QEMU_TIMEOUT.
          set +e
          timeout --signal=KILL "${QEMU_TIMEOUT}" \
            qemu-system-x86_64 \
              -machine q35 -accel kvm -cpu host \
              -smp 4 -m 6G \
              -drive file=overlay.qcow2,if=virtio,format=qcow2 \
              -drive file=seed.iso,media=cdrom \
              -drive file=src.iso,media=cdrom \
              -nic user,model=virtio-net-pci \
              -display none \
              -serial file:serial.log \
              -no-reboot
          qemu_rc=$?
          set -e
          echo "qemu exit code: ${qemu_rc}"
          echo "---- serial log (tail) ----"
          tail -n 60 serial.log || true

      - name: Evaluate the result
        run: |
          set -euo pipefail
          if ! grep -q "TIDEMARK-SPIKE-RC=0" serial.log; then
            echo "spike did not finish cleanly (no TIDEMARK-SPIKE-RC=0 marker)"
            exit 1
          fi
          if ! grep -q "SUMMARY: ALL PASS" serial.log; then
            echo "spike did not report SUMMARY: ALL PASS"
            exit 1
          fi
          echo "kernel spike passed: all Phase 0 assumptions held"

      - name: Upload the serial log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-spike-serial-log
          path: serial.log
          if-no-files-found: warn

# SPDX-License-Identifier: Apache-2.0
#
# Lima template for the AgentOS Tidemark Phase 0 kernel spike on Apple silicon.
# STATUS: Phase 0 draft, not yet run. It boots a stock Fedora 45 Cloud aarch64
# image under Virtualization.framework (vz) on the M1 Pro, installs the build
# dependencies, and mounts the spike directory so you can `make test` inside.
#
# As of 2026-10-16 Fedora 45 is still at Beta (45_Beta 1.3, composed 2026-09-05;
# verified against the GPG-signed CHECKSUM on dl.fedoraproject.org). Update the
# image location and digest to the GA Generic Cloud qcow2 when Fedora 45 is
# released. The Fedora 44 GA Generic qcow2 is a known-good fallback; its digests
# are recorded in spike/README.md.
#
# Usage (from the spike directory):
#   limactl start --name tidemark-spike lima/fedora-45.yaml
#   limactl shell tidemark-spike -- sudo make -C /opt/tidemark-spike test
# No nested virtualization is required.

minimumLimaVersion: "2.0.0"

vmType: "vz"
arch: "aarch64"
cpus: 4
memory: "6GiB"
disk: "20GiB"

images:
  # Fedora 45 Beta Cloud Generic (aarch64). Replace with the GA image at release.
  - location: "https://dl.fedoraproject.org/pub/fedora/linux/releases/test/45_Beta/Cloud/aarch64/images/Fedora-Cloud-Base-Generic-45_Beta-1.3.aarch64.qcow2"
    arch: "aarch64"
    digest: "sha256:2bacfd793c2e769a325520da64a0bfcd38a7bbd755561d3d332a35b5ae83169c"

# The spike needs no container runtime; skip Lima's default containerd install.
containerd:
  system: false
  user: false

mounts:
  # The spike directory, mounted writable at a space-free path in the guest.
  # Edit `location` if the repository lives elsewhere on the host. macOS asks
  # once for permission (privacy controls) before limactl can share a folder
  # under ~/Desktop. Builds write vmlinux.h, the object, the binary, go.sum and
  # .cache/ into this directory; spike/.gitignore excludes all but go.sum.
  - location: "~/Desktop/AI-Operating System/spike"
    mountPoint: "/opt/tidemark-spike"
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      bash /opt/tidemark-spike/provision/fedora-deps.sh

message: |
  Fedora 45 kernel-spike VM is ready.
  Build and run the spike (inside the VM, as root):
      limactl shell {{.Name}} -- sudo make -C /opt/tidemark-spike test
  A passing run ends with a line of the form:  SUMMARY: ALL PASS (12/12)
  This is a Phase 0 draft; read spike/README.md for what each test does and does
  not prove, and how a failure maps to the kill criteria.
